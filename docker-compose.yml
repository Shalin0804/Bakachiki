# Local MySQL 8.0 for development: `docker compose up -d`
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bakachiki
      MYSQL_ROOT_PASSWORD: bakachiki
    ports:
      - "3306:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
volumes:
  mysql-data:
