<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="1000" height="1200">
<defs>
<radialGradient id="bgp" cx="50%" cy="38%" r="75%">
<stop offset="0" stop-color="#141a14"/><stop offset="1" stop-color="#070907"/>
</radialGradient>
<radialGradient id="glowp" cx="50%" cy="100%" r="60%">
<stop offset="0" stop-color="#39D353" stop-opacity=".35"/><stop offset="1" stop-color="#39D353" stop-opacity="0"/>
</radialGradient>
<linearGradient id="bodyp" x1="0" x2="1">
<stop offset="0" stop-color="#b9a782"/><stop offset=".22" stop-color="#d8c8a6"/>
<stop offset=".55" stop-color="#ebdfc6"/><stop offset=".85" stop-color="#d8c8a6"/><stop offset="1" stop-color="#b9a782"/>
</linearGradient>
<filter id="puffp" x="-10%" y="-10%" width="120%" height="130%">
<feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
<feSpecularLighting in="b" surfaceScale="6" specularConstant=".9" specularExponent="22" lighting-color="#d9ffe0" result="s">
<feDistantLight azimuth="235" elevation="48"/>
</feSpecularLighting>
<feComposite in="s" in2="SourceAlpha" operator="in" result="sh"/>
<feDropShadow dx="3" dy="6" stdDeviation="3" flood-color="#000" flood-opacity=".55" in="SourceGraphic" result="d"/>
<feMerge><feMergeNode in="d"/><feMergeNode in="sh"/></feMerge>
</filter>
<pattern id="knitp" width="8" height="10" patternUnits="userSpaceOnUse">
<path d="M0 0 L4 5 L8 0 M0 5 L4 10 L8 5" stroke="#000" stroke-opacity=".08" fill="none"/>
</pattern>
</defs>
<rect width="1000" height="1200" fill="#d8c8a6"/><rect width="1000" height="1200" fill="url(#knitp)"/>
<text x="-80" y="760" font-family="'Nirmala UI','Mangal','Noto Sans Devanagari','Kohinoor Devanagari',sans-serif" font-weight="700" font-size="620" fill="#168A32" filter="url(#puffp)">बकचि</text>
<rect width="1000" height="1200" fill="url(#glowp)" opacity=".7"/>
</svg>